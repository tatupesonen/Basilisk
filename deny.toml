# cargo-deny configuration (ADR-018: the project is GPL-3.0-or-later, so
# dependencies must be GPL-3.0-compatible). Run by scripts/gate.sh.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
# "Unmaintained" notices (no vulnerability) for crates that arrive only
# through the GUI stack and have no upgrade. Each is removed when the
# dependency that pulls it in moves on; a new advisory still fails the check.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro) is unmaintained; pulled in by egui_dock 0.21.1, no replacement release yet" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is no longer released standalone (folded into zbus); pulled in by accesskit's Linux backend through eframe 0.36.2" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: as zvariant" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: as zvariant" },
]
