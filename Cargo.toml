[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
authors = ["basilisk contributors"]

[workspace.dependencies]
# Internal crates (see docs/PLAN.md, crate map). Add a line when a crate is created.
bk-core = { path = "crates/bk-core" }
bk-marshal = { path = "crates/bk-marshal" }
bk-pcode = { path = "crates/bk-pcode" }
bk-sleigh-syntax = { path = "crates/bk-sleigh-syntax" }
bk-lang = { path = "crates/bk-lang" }
bk-bin = { path = "crates/bk-bin" }
bk-elf = { path = "crates/bk-elf" }
bk-testkit = { path = "crates/bk-testkit" }

# Foundations (exact versions, each at least two weeks old; see docs/LOOP.md)
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
bitflags = "2.13.2"
memchr = "2.8.3"
memmap2 = "0.9.11"
rayon = "1.12.0"
parking_lot = "0.12.5"
roxmltree = "0.21.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

# SLEIGH front end (bk-sleigh-syntax; evaluations in docs/features/sleigh-syntax.md)
string-interner = { version = "0.20.0", default-features = false, features = ["std", "backends", "inline-more"] }
rustc-hash = "2.1.3"
num-bigint = "0.4.8"

# Test support
proptest = "1.12.0"
rstest = "0.27.0"
insta = "1.49.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight binary-parsing and compiler-style code more than they help.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Correctness-adjacent restrictions we do want (ADR-009).
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"

[profile.dev]
# SLEIGH decoding and the decompiler are painfully slow unoptimised; keep
# debug info but optimise.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

[profile.bench]
inherits = "release"
