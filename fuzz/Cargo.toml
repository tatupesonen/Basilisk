# The one fuzz crate for the whole workspace (docs/LOOP.md, "Fuzzing").
# Every fuzz target of every crate lives here: add the crate under
# [dependencies] and one [[bin]] entry, both in alphabetical order, and put
# the target in fuzz_targets/<crate>_<what>.rs. Do not create a fuzz crate
# anywhere else.
[package]
name = "basilisk-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bk-core = { path = "../crates/bk-core" }
bk-lang = { path = "../crates/bk-lang" }
bk-marshal = { path = "../crates/bk-marshal" }
bk-sleigh-syntax = { path = "../crates/bk-sleigh-syntax" }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "bk_lang_readers"
path = "fuzz_targets/bk_lang_readers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bk_marshal_packed_decode"
path = "fuzz_targets/bk_marshal_packed_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bk_marshal_xml_decode"
path = "fuzz_targets/bk_marshal_xml_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bk_sleigh_syntax_parse"
path = "fuzz_targets/bk_sleigh_syntax_parse.rs"
test = false
doc = false
bench = false
