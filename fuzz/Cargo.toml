# The one fuzz crate for the whole workspace (docs/LOOP.md, "Fuzzing").
# Every fuzz target of every crate lives here: add the crate under
# [dependencies] and one [[bin]] entry, both in alphabetical order, and put
# the target in fuzz_targets/<crate>_<what>.rs. Do not create a fuzz crate
# anywhere else.
[package]
name = "basilisk-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bk-bin = { path = "../crates/bk-bin" }
bk-binutils-sys = { path = "../crates/bk-binutils-sys" }
bk-core = { path = "../crates/bk-core" }
bk-cspec = { path = "../crates/bk-cspec" }
bk-decomp-cfg = { path = "../crates/bk-decomp-cfg" }
bk-decomp-range = { path = "../crates/bk-decomp-range" }
bk-decomp-symbols = { path = "../crates/bk-decomp-symbols" }
bk-decomp-types = { path = "../crates/bk-decomp-types" }
bk-elf = { path = "../crates/bk-elf" }
bk-lang = { path = "../crates/bk-lang" }
bk-marshal = { path = "../crates/bk-marshal" }
bk-pcode = { path = "../crates/bk-pcode" }
bk-sla = { path = "../crates/bk-sla" }
bk-sleigh = { path = "../crates/bk-sleigh" }
bk-sleigh-compiler = { path = "../crates/bk-sleigh-compiler" }
bk-sleigh-snippet = { path = "../crates/bk-sleigh-snippet" }
bk-sleigh-syntax = { path = "../crates/bk-sleigh-syntax" }
bk-testkit = { path = "../crates/bk-testkit" }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "bk_binutils_sys_disassemble"
path = "fuzz_targets/bk_binutils_sys_disassemble.rs"
test = false
doc = false
bench = false

