[package]
name = "bk-binutils-sys"
description = "basilisk: binutils 2.41's disassemblers (libopcodes), built from vendored source and wrapped in a minimal sound interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"
links = "bk_binutils"

[dependencies]
thiserror = { workspace = true }

[build-dependencies]
cc = { workspace = true }

# This crate cannot inherit `[workspace.lints]`: the workspace forbids
# `unsafe_code`, and a forbid cannot be relaxed by the crate-level attribute
# ADR-019 asks for. The tables below are the workspace's, with `unsafe_code`
# at "deny" so that `src/lib.rs` can allow it, with its reason, in one place.
# Keep them in step with the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
