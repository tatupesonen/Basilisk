name: Pages

# Deploys the website and documentation (site/, ADR-031) to GitHub Pages
# (Settings → Pages → Source is "GitHub Actions"; published at the owner's
# word on 2026-11-14). Runs on every push to master that changes the site
# or a file the site is built from (the parity matrix and the milestones
# are read from docs/ at build time), and by hand from the Actions tab or
# `gh workflow run Pages`.
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/PARITY.md'
      - 'docs/PLAN.md'
      - 'scripts/site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # base_path is "/<repo>" for https://<user>.github.io/<repo>/ and empty
      # for a custom domain; the site takes it as its base path.
      - name: Build the site in its container
        run: |
          SITE_BASE="${{ steps.pages.outputs.base_path }}/" \
          SITE_URL="${{ steps.pages.outputs.origin }}" \
          scripts/site.sh build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
