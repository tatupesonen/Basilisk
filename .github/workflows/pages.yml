name: Pages

# Deploys the website and documentation (site/, ADR-031) to GitHub Pages.
# Manual for now: the repository owner must first set Settings → Pages →
# Build and deployment → Source to "GitHub Actions". Then run this workflow
# from the Actions tab (or `gh workflow run Pages`).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # base_path is "/<repo>" for https://<user>.github.io/<repo>/ and empty
      # for a custom domain; the site takes it as its base path.
      - name: Build the site in its container
        run: |
          SITE_BASE="${{ steps.pages.outputs.base_path }}/" \
          SITE_URL="${{ steps.pages.outputs.origin }}" \
          scripts/site.sh build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
